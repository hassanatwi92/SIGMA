nav img{height:40px;width:auto;background:#fff;padding:4px 8px;border-radius:6px}
.links{display:flex;gap:28px;font-size:15px}

.links a:hover{color:var(--brass)}
.lang{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:#cfd9e6;padding:6px 11px;font:600 13px var(--sans);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--brass);color:var(--deep)}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;background:linear-gradient(rgba(6,23,45,.78),rgba(6,23,45,.86)),url(home1.jpg) center/cover,var(--deep);color:#fff;overflow:hidden;padding:110px 0 70px}
.sigma{position:absolute;inset-inline-end:-4%;top:50%;transform:translateY(-50%);font:600 clamp(380px,60vw,820px)/1 var(--serif);color:transparent;-webkit-text-stroke:1.5px rgba(194,162,107,.35);user-select:none;pointer-events:none}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(40px,7vw,84px);max-width:11em}
.hero h1 span{display:block}
.hero h1 span+span{color:var(--brass)}

.btns{display:flex;gap:14px;flex-wrap:wrap}

@media(prefers-reduced-motion:reduce){.reveal>*{animation:none;opacity:1;transform:none}html{scroll-behavior:auto}}

.facts{background:var(--navy);color:#fff}
.facts .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.facts div{padding:28px 24px;border-inline-start:1px solid rgba(255,255,255,.12)}
.facts div:first-child{border:0}
.facts b{display:block;font:600 30px var(--serif);color:var(--brass)}

.lead{color:var(--mute);max-width:36em}

.svc{border-top:2px solid var(--navy)}
.svc div{display:grid;gap:6px;padding:22px 0;border-bottom:1px solid var(--line)}
.svc h3{font-size:21px}
.svc p{color:var(--mute)}

.grid h3{font-size:20px;margin-bottom:10px;color:var(--blue)}
.grid p{color:var(--mute);font-size:16px}

.ceo ul{list-style:none;margin-top:8px}
.ceo li{padding:14px 0;border-top:1px solid rgba(255,255,255,.14);color:#e4ebf3}
.ceo a{color:var(--brass)}

.soc{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.soc img{width:40px;height:40px;object-fit:contain;transition:transform .2s}
.soc a:hover img{transform:scale(1.12)}
/* contact */
.contact dl{display:grid;grid-template-columns:auto 1fr;gap:14px 28px;margin:24px 0 30px}
.contact dt{font-weight:600;color:var(--blue)}
.contact dd a{text-decoration:none;border-bottom:1px solid var(--brass)}
.contact .btn{color:var(--navy);border-color:var(--navy);margin-inline-end:10px;margin-bottom:10px}
.contact .btn:hover{background:var(--navy);color:#fff}
footer{background:var(--deep);color:#8fa1b8;text-align:center;padding:26px;font-size:14px}

@media(max-width:820px){
.links{display:none}

.facts .wrap{grid-template-columns:1fr}
.facts div{border:0;border-top:1px solid rgba(255,255,255,.12);padding:18px 24px}
section{padding:64px 0}
.sigma{opacity:.6}
}

  $('#svc').innerHTML=t.svc.map(s=>`<div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');
  $('#whyGrid').innerHTML=t.why.map(s=>`<div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');
  $('#ceoList').innerHTML=t.ceo.map(s=>`<li>${s}</li>`).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  try{localStorage.setItem('lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#yr').textContent=new Date().getFullYear();
let init='en';try{init=localStorage.getItem('lang')||'en'}catch(e){}
setLang(T[init]?init:'en');
</script>
